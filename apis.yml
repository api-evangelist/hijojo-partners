aid: hijojo-partners
name: HiJoJo Partners
description: >-
  HiJoJo Partners Inc. (HiJoJo Partners株式会社) is a Tokyo-based independent asset
  management and fintech group, established in November 2017 and registered with the
  Director of the Kanto Local Finance Bureau (No. 3065) for Type II Financial
  Instruments Business, Investment Management Business, and Investment Advisory and
  Agency Business. The firm forms, sells and manages funds that give Japanese
  institutional and individual investors access to late-stage private and pre-IPO
  companies, and works to develop Japan's secondary market for unlisted shares. It
  operates three lines: HiJoJo Prime (in-person advisory for investors with 100M JPY
  or more in investable assets), HiJoJo.com (an online fund platform for individual
  investors with 30M JPY or more), and HiJoJo Private Market Solution for
  institutional investors and startups. HiJoJo joined the Nasdaq Private Market
  investor consortium in 2024 to expand secondary-market access in Japan. Its
  investor-facing platform is delivered as an authenticated member web application;
  the company publishes no public API, developer portal, SDK or machine-readable
  specification of any kind.
